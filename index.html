<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Linkist - Interactive Mobile Mockup</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #F4F1EA; }
        body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .app { width: 100%; height: 100%; display: flex; flex-direction: column; background: #F4F1EA; color: #17181A; }
        .content { flex: 1; overflow-y: auto; padding: 0; -webkit-overflow-scrolling: touch; }
        .screen { padding: 20px; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .nav-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; border-top: 1px solid #E2DED3; background: #FBF9F4; padding: 8px 0; }
        .nav-item { padding: 12px 8px; text-align: center; font-size: 12px; cursor: pointer; border: none; background: none; color: #6B6A66; transition: color 0.2s; }
        .nav-item.active { color: #B1394B; font-weight: 600; }
        .card { background: white; border: 0.5px solid #E2DED3; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .header { font-size: 14px; color: #6B6A66; text-transform: uppercase; letter-spacing: 0.15em; margin: 20px 0 10px; font-weight: 600; }
        .heading { font-size: 28px; font-weight: 500; margin: 16px 0; color: #17181A; }
        .subheading { font-size: 16px; font-weight: 600; margin: 12px 0 8px; color: #2a2a2a; }
        .text { font-size: 14px; line-height: 1.5; color: #6B6A66; margin: 8px 0; }
        .button { background: #B1394B; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; margin: 8px 4px 8px 0; }
        .button:active { opacity: 0.9; }
        .button-outline { background: transparent; color: #6B6A66; border: 0.5px solid #E2DED3; padding: 10px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .person { display: flex; gap: 12px; align-items: flex-start; margin: 12px 0; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #EAE6DC; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #6B6A66; flex-shrink: 0; }
        .person-info { flex: 1; }
        .person-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
        .person-meta { font-size: 12px; color: #6B6A66; }
        .stat { text-align: center; }
        .stat-number { font-size: 24px; font-weight: 500; margin-bottom: 4px; }
        .stat-label { font-size: 13px; color: #6B6A66; }
        .form-field { margin: 16px 0; }
        .form-field label { display: block; font-size: 14px; color: #6B6A66; margin-bottom: 6px; }
        .form-field input, .form-field select { width: 100%; padding: 10px; border: 0.5px solid #E2DED3; border-radius: 8px; font-size: 14px; font-family: inherit; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .contact-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 0.5px solid #E2DED3; cursor: pointer; }
        .contact-item:last-child { border-bottom: none; }
        .back-btn { background: none; border: none; color: #6B6A66; font-size: 18px; cursor: pointer; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        const CONTACTS = [
            { id: 1, name: 'Biji Thomas', company: 'Bettroi FZE', title: 'CEO & Founder', type: 'work' },
            { id: 2, name: 'Surya Murali', company: '', title: 'Professional', type: 'personal' },
            { id: 3, name: 'Shrinivasa K', company: 'Axis Bank', title: 'Banking', type: 'work' },
            { id: 4, name: 'Frederic P.', company: 'Capgemini', title: 'Partner', type: 'work' },
            { id: 5, name: 'Vikram P.', company: 'Emirates NBD', title: 'SVP Regional Head', type: 'work' },
        ];

        function HomeScreen() {
            const [activeNudge, setActiveNudge] = useState(null);
            return (
                <div className="screen">
                    <div style={{ fontSize: '12px', color: '#6B6A66', textTransform: 'uppercase', letterSpacing: '0.15em', marginBottom: '16px' }}>
                        Good evening Dubai
                    </div>
                    <h1 className="heading">Liju<span style={{ color: '#B1394B' }}>.</span></h1>
                    <p className="text" style={{ marginBottom: '24px' }}>Make room for a meaningful connection.</p>

                    <div className="header">Today, with intention</div>

                    {!activeNudge ? (
                        <>
                            <div className="card" style={{ borderLeft: '4px solid #B1394B' }}>
                                <div style={{ fontSize: '12px', color: '#B1394B', textTransform: 'uppercase', marginBottom: '8px' }}>Your next best step</div>
                                <h3 className="subheading">Pick up where you left off.</h3>
                                <div className="person">
                                    <div className="avatar">BT</div>
                                    <div className="person-info">
                                        <div className="person-name">Biji Thomas</div>
                                        <div className="person-meta">Bettroi FZE · 4 days ago</div>
                                    </div>
                                </div>
                                <p className="text">You discussed the ambassador programme. A thoughtful follow-up keeps the conversation moving.</p>
                                <button className="button" onClick={() => setActiveNudge('biji')}>Review follow-up →</button>
                                <button className="button-outline" onClick={() => setActiveNudge(null)}>Later</button>
                            </div>

                            <div className="card" style={{ cursor: 'pointer' }} onClick={() => setActiveNudge('surya')}>
                                <div className="person">
                                    <div className="avatar">SM</div>
                                    <div className="person-info">
                                        <div className="person-name">Add context</div>
                                        <div style={{ fontSize: '14px', fontWeight: '500', marginTop: '4px' }}>Remember why you connected</div>
                                        <div className="person-meta">Surya Murali · Recent exchange</div>
                                    </div>
                                </div>
                            </div>

                            <div className="card" style={{ cursor: 'pointer' }} onClick={() => setActiveNudge('shri')}>
                                <div className="person">
                                    <div className="avatar">SK</div>
                                    <div className="person-info">
                                        <div className="person-name">Reconnect</div>
                                        <div style={{ fontSize: '14px', fontWeight: '500', marginTop: '4px' }}>Keep a good connection warm</div>
                                        <div className="person-meta">Shrinivasa K · Referral source</div>
                                    </div>
                                </div>
                            </div>
                        </>
                    ) : (
                        <>
                            <button className="back-btn" onClick={() => setActiveNudge(null)}>← Back</button>
                            <div className="card">
                                <h3 className="subheading">Follow up with {activeNudge === 'biji' ? 'Biji' : activeNudge === 'surya' ? 'Surya' : 'Shrinivasa'}</h3>
                                <div className="form-field">
                                    <label>Your message</label>
                                    <textarea style={{ width: '100%', minHeight: '100px', padding: '10px', border: '0.5px solid #E2DED3', borderRadius: '8px', fontFamily: 'inherit', fontSize: '14px' }} placeholder="Write your message..."></textarea>
                                </div>
                                <button className="button">Send message</button>
                            </div>
                        </>
                    )}

                    <div className="header" style={{ marginTop: '32px' }}>Your network</div>
                    <div className="grid-2">
                        <div className="card">
                            <div className="stat">
                                <div className="stat-number">1,000</div>
                                <div className="stat-label">Contacts</div>
                            </div>
                        </div>
                        <div className="card">
                            <div className="stat">
                                <div className="stat-number">157</div>
                                <div className="stat-label">Companies</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ContactsScreen() {
            const [selected, setSelected] = useState(null);
            return (
                <div className="screen">
                    {!selected ? (
                        <>
                            <h1 className="heading">Contacts</h1>
                            <div style={{ marginBottom: '12px' }}>
                                <input type="text" placeholder="Search contacts..." style={{ width: '100%', padding: '10px', border: '0.5px solid #E2DED3', borderRadius: '8px', fontSize: '14px' }} />
                            </div>
                            {CONTACTS.map(contact => (
                                <div key={contact.id} className="contact-item" onClick={() => setSelected(contact)}>
                                    <div>
                                        <div style={{ fontWeight: '500', fontSize: '14px' }}>{contact.name}</div>
                                        <div style={{ fontSize: '12px', color: '#6B6A66' }}>{contact.company || contact.title}</div>
                                    </div>
                                    <span style={{ color: '#6B6A66' }}>›</span>
                                </div>
                            ))}
                        </>
                    ) : (
                        <>
                            <button className="back-btn" onClick={() => setSelected(null)}>← Back</button>
                            <div className="person">
                                <div className="avatar">{selected.name.charAt(0)}{selected.name.split(' ')[1]?.charAt(0)}</div>
                                <div className="person-info">
                                    <h2 className="subheading">{selected.name}</h2>
                                    <div className="text">{selected.title}</div>
                                    <div className="text">{selected.company}</div>
                                </div>
                            </div>
                            <div className="card">
                                <button className="button" style={{ width: '100%' }}>Send message</button>
                                <button className="button-outline" style={{ width: '100%', marginTop: '8px' }}>Request introduction</button>
                            </div>
                        </>
                    )}
                </div>
            );
        }

        function SettingsScreen() {
            return (
                <div className="screen">
                    <h1 className="heading">Settings</h1>
                    <div className="header">Appearance</div>
                    <div className="form-field">
                        <label>Theme</label>
                        <select>
                            <option>Auto</option>
                            <option>Light</option>
                            <option>Dark</option>
                        </select>
                    </div>
                    <div className="header" style={{ marginTop: '24px' }}>Profile Sharing</div>
                    <div className="form-field">
                        <label>Who can see your profile</label>
                        <select>
                            <option>Exchange first</option>
                            <option>Members only</option>
                            <option>Anyone</option>
                        </select>
                    </div>
                    <div className="header" style={{ marginTop: '24px' }}>Notifications</div>
                    <div style={{ padding: '12px 0', borderBottom: '0.5px solid #E2DED3' }}>
                        <div style={{ fontWeight: '500', marginBottom: '4px' }}>Follow-up reminders</div>
                        <input type="checkbox" defaultChecked /> <span style={{ fontSize: '14px', color: '#6B6A66' }}>Enabled</span>
                    </div>
                    <div style={{ padding: '12px 0' }}>
                        <div style={{ fontWeight: '500', marginBottom: '4px' }}>Email digests</div>
                        <input type="checkbox" /> <span style={{ fontSize: '14px', color: '#6B6A66' }}>Disabled</span>
                    </div>
                </div>
            );
        }

        function ProfileScreen() {
            return (
                <div className="screen">
                    <h1 className="heading">Your Profile</h1>
                    <div className="person">
                        <div className="avatar" style={{ width: '48px', height: '48px', fontSize: '18px' }}>LM</div>
                        <div className="person-info">
                            <h2 className="subheading">Liju Mathew</h2>
                            <div className="text">Founder & CEO</div>
                            <div className="text">RatioX Labs DWC-LLC</div>
                        </div>
                    </div>
                    <div className="header" style={{ marginTop: '24px' }}>About</div>
                    <div className="text">Building tools for relationship intelligence. Based in Dubai. Passionate about connecting people meaningfully.</div>
                    <div className="header" style={{ marginTop: '24px' }}>Skills & Interests</div>
                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px' }}>
                        {['Product strategy', 'Startup ecosystems', 'Data analysis', 'Angel investing'].map(skill => (
                            <div key={skill} style={{ background: '#EAE6DC', padding: '8px 12px', borderRadius: '16px', fontSize: '13px' }}>{skill}</div>
                        ))}
                    </div>
                    <button className="button" style={{ width: '100%', marginTop: '24px' }}>Edit profile</button>
                </div>
            );
        }

        function App() {
            const [tab, setTab] = useState('home');

            const screens = {
                home: <HomeScreen />,
                contacts: <ContactsScreen />,
                connect: <div className="screen"><h1 className="heading">Connect</h1><p className="text">Find and connect with professionals in your network.</p></div>,
                cards: <div className="screen"><h1 className="heading">Cards</h1><p className="text">Manage your NFC cards and digital presence.</p></div>,
                you: <SettingsScreen />
            };

            return (
                <div className="app">
                    <div className="content">{screens[tab]}</div>
                    <div className="nav-bar">
                        <button className={`nav-item ${tab === 'home' ? 'active' : ''}`} onClick={() => setTab('home')}>Home</button>
                        <button className={`nav-item ${tab === 'contacts' ? 'active' : ''}`} onClick={() => setTab('contacts')}>Contacts</button>
                        <button className={`nav-item ${tab === 'connect' ? 'active' : ''}`} onClick={() => setTab('connect')}>Connect</button>
                        <button className={`nav-item ${tab === 'cards' ? 'active' : ''}`} onClick={() => setTab('cards')}>Cards</button>
                        <button className={`nav-item ${tab === 'you' ? 'active' : ''}`} onClick={() => setTab('you')}>You</button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
